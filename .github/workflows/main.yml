name: Windows Desktop

on:
  push:
    branches: [master, main, 'codex/**']
    tags: ['v[0-9]*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  qualification:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the locked build and release evidence
        shell: pwsh
        run: |
          python scripts/validate-build-manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-release-validation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF.StartsWith('refs/tags/')) {
            python scripts/validate-build-manifest.py --release-tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [release, diagnostic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dependency-archives
          key: windows-x64-archives-${{ hashFiles('build-manifest.json') }}
      - name: Build, test and package Windows x64
        shell: pwsh
        run: |
          $diagnostic = '${{ matrix.variant }}' -eq 'diagnostic'
          ./scripts/build-windows.ps1 -Diagnostic:$diagnostic
      - name: Check isolated NativeShell startup and strict CSP
        if: matrix.variant == 'release'
        shell: pwsh
        run: ./scripts/test-native-shell.ps1 -StagePath build/windows/release/portable-stage -ReportDirectory build/windows/release/native-shell-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.variant }}
          path: build/windows/${{ matrix.variant }}/assets/*
          if-no-files-found: error
          compression-level: 0
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.variant }}-logs
          path: |
            build/windows/${{ matrix.variant }}/CMakeFiles/CMakeConfigureLog.yaml
            build/windows/${{ matrix.variant }}/tests/**/Testing/Temporary/LastTest.log
            build/windows/${{ matrix.variant }}/native-shell-smoke/*.json
            build/windows/${{ matrix.variant }}/native-shell-smoke/*.stdout
            build/windows/${{ matrix.variant }}/native-shell-smoke/*.stderr
            build/windows/${{ matrix.variant }}/tests/render/renderer-report.json
            build/windows/${{ matrix.variant }}/tests/render/renderer-report.json.failure.png
            build/windows/${{ matrix.variant }}/windows-runtime-imports.json
            build/windows/${{ matrix.variant }}/tests/render/runtime-imports.json
            build/toolchain/wix/extract.log
          if-no-files-found: ignore

  publish:
    needs: [qualification, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'DevLn737/jellyfin-desktop'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: release-assets
      - name: Verify monotonic MSI release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-release-version.py
      - name: Publish direct installer and portable assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content build-manifest.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($manifest.appVersion)") { throw 'Tag and manifest version differ' }
          $assetFiles = @(Get-ChildItem release-assets -File)
          $checksums = $assetFiles | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath release-assets/SHA256SUMS -Encoding ascii
          $releaseArguments = @('release', 'create', $env:GITHUB_REF_NAME, '--repo', $manifest.releaseRepository,
            '--verify-tag', '--title', "Desktop $($manifest.appVersion)", '--generate-notes')
          if ($manifest.appVersion -match '-rc\.') { $releaseArguments += @('--prerelease', '--latest=false') }
          else { $releaseArguments += '--latest' }
          $releaseArguments += @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
